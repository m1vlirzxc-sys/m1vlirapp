<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mivlir App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0b0e;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(11, 11, 14, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1a1a24;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ff7b00;
        }

        .lang-btn {
            background: #161622;
            border: 1px solid #2a2a3c;
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }

        .lang-btn:active {
            transform: scale(0.95);
            background: #ff7b00;
            border-color: #ff7b00;
        }

        main {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background: #13131c;
            border: 1px solid #202030;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .card h2 {
            font-size: 15px;
            font-weight: 600;
        }

        .card p {
            font-size: 12px;
            color: #9ca3af;
            line-height: 1.4;
        }

        textarea {
            width: 100%;
            height: 80px;
            background: #08080c;
            border: 1px solid #222233;
            border-radius: 12px;
            padding: 10px;
            color: #fff;
            font-size: 13px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #ff7b00;
        }

        .submit-btn {
            background: #ff7b00;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .submit-btn:active {
            transform: scale(0.98);
            background: #e06d00;
        }

        .status-toast {
            text-align: center;
            font-size: 12px;
            color: #34d399;
            min-height: 16px;
        }

        /* УПДЕЙТЕР В СТИЛЕ CS */
        .upgrade-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .select-box {
            background: #0a0a0f;
            border: 1px solid #222233;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .select-box label {
            font-size: 11px;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
        }

        select {
            background: #161622;
            color: #fff;
            border: 1px solid #2a2a3c;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        .upgrade-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 5px;
        }

        .wheel-container {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: conic-gradient(#ff7b00 0deg 180deg, #181824 180deg 360deg);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 15px rgba(255, 123, 0, 0.2);
            border: 2px solid #2a2a3c;
            transition: transform 1.2s cubic-bezier(0.15, 0.85, 0.35, 1);
        }

        .wheel-center {
            width: 88px;
            height: 88px;
            background: #0d0d12;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #2a2a3c;
            text-align: center;
        }

        .wheel-chance {
            font-size: 15px;
            font-weight: 700;
            color: #ff7b00;
        }

        .wheel-label {
            font-size: 9px;
            color: #888;
            text-transform: uppercase;
        }

        .pointer {
            position: absolute;
            top: -6px;
            width: 0; 
            height: 0; 
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 11px solid #ff7b00;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
        }

        .upgrade-result {
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            min-height: 18px;
            color: #d1d5db;
        }

        .upgrade-btn {
            background: #ff7b00;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.15s;
        }

        .upgrade-btn:active {
            transform: scale(0.97);
            background: #e06d00;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">m1vlirapp</div>
        <button class="lang-btn" id="langToggleBtn">UA / РУС</button>
    </header>

    <main>
        <!-- Предложить идею -->
        <div class="card">
            <h2 id="cardTitle">Предложить идею</h2>
            <p id="cardDesc">Напиши свою мысль — она улетит в группу.</p>
            <textarea id="ideaInput" placeholder="Текст идеи..."></textarea>
            <button class="submit-btn" id="sendBtn">Отправить</button>
            <div class="status-toast" id="statusToast"></div>
        </div>

        <!-- Апгрейдер (Мемы 1000-7, 67 -> 228, 69) -->
        <div class="card">
            <h2 id="upTitle">🎰 Рофл Апгрейдер</h2>
            <div class="upgrade-grid">
                <div class="select-box">
                    <label id="fromLabel">Твой предмет (Деп)</label>
                    <select id="fromItem">
                        <option value="67">Шмотка [67]</option>
                        <option value="1000">Мем [1000-7]</option>
                    </select>
                </div>
                <div class="select-box">
                    <label id="toLabel">На что апаем</label>
                    <select id="toItem">
                        <option value="69">Шмотка [69]</option>
                        <option value="228">Шмотка [228]</option>
                    </select>
                </div>
            </div>

            <div class="upgrade-center">
                <div class="wheel-container" id="wheel">
                    <div class="pointer"></div>
                    <div class="wheel-center">
                        <div class="wheel-chance" id="chanceText">30%</div>
                        <div class="wheel-label">Шанс</div>
                    </div>
                </div>
                <div class="upgrade-result" id="upgradeResult">Выбери вещи и крути апгрейд</div>
                <button class="upgrade-btn" id="upgradeBtn">UPGRADE</button>
            </div>
        </div>
    </main>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Переключение языка
        let currentLang = 'ru';
        const langToggleBtn = document.getElementById('langToggleBtn');
        const cardTitle = document.getElementById('cardTitle');
        const cardDesc = document.getElementById('cardDesc');
        const ideaInput = document.getElementById('ideaInput');
        const sendBtn = document.getElementById('sendBtn');
        const upTitle = document.getElementById('upTitle');
        const fromLabel = document.getElementById('fromLabel');
        const toLabel = document.getElementById('toLabel');
        const upgradeBtn = document.getElementById('upgradeBtn');
        const upgradeResult = document.getElementById('upgradeResult');

        const texts = {
            ru: {
                title: "Предложить идею",
                desc: "Напиши свою мысль — она улетит в группу.",
                placeholder: "Текст идеи...",
                send: "Отправить",
                upTitle: "🎰 Рофл Апгрейдер",
                from: "Твой предмет (Деп)",
                to: "На что апаем",
                init: "Выбери вещи и крути апгрейд",
                success: "Отправлено в группу!"
            },
            ua: {
                title: "Запропонувати ідею",
                desc: "Напиши свою думку — вона полетить у групу.",
                placeholder: "Текст ідеї...",
                send: "Надіслати",
                upTitle: "🎰 Рофл Апгрейдер",
                from: "Твій предмет (Деп)",
                to: "На що апаємо",
                init: "Вибери речі та крути апгрейд",
                success: "Надіслано в групу!"
            }
        };

        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'ru' ? 'ua' : 'ru';
            cardTitle.textContent = texts[currentLang].title;
            cardDesc.textContent = texts[currentLang].desc;
            ideaInput.placeholder = texts[currentLang].placeholder;
            sendBtn.textContent = texts[currentLang].send;
            upTitle.textContent = texts[currentLang].upTitle;
            fromLabel.textContent = texts[currentLang].from;
            toLabel.textContent = texts[currentLang].to;
            if (upgradeResult.textContent.includes("Выбери") || upgradeResult.textContent.includes("Вибери")) {
                upgradeResult.textContent = texts[currentLang].init;
            }
        });

        // Отправка идеи в группу
        const statusToast = document.getElementById('statusToast');
        sendBtn.addEventListener('click', () => {
            const text = ideaInput.value.trim();
            if (!text) {
                statusToast.style.color = '#f87171';
                statusToast.textContent = currentLang === 'ru' ? 'Напиши текст идеи!' : 'Напиши текст ідеї!';
                return;
            }

            const payload = JSON.stringify({ idea: text });

            if (tg && tg.initData) {
                try {
                    tg.sendData(payload);
                    ideaInput.value = '';
                    statusToast.style.color = '#34d399';
                    statusToast.textContent = texts[currentLang].success;
                } catch (err) {
                    statusToast.style.color = '#f87171';
                    statusToast.textContent = 'Ошибка отправки';
                }
            } else {
                ideaInput.value = '';
                statusToast.style.color = '#34d399';
                statusToast.textContent = texts[currentLang].success + ' (тест)';
            }
        });

        // Цены для расчета честного шанса апгрейдера
        const itemValues = {
            "67": 67,
            "1000": 993, // 1000-7
            "69": 69,
            "228": 228
        };

        const fromSelect = document.getElementById('fromItem');
        const toSelect = document.getElementById('toItem');
        const wheel = document.getElementById('wheel');
        const chanceText = document.getElementById('chanceText');

        function updateChance() {
            const valFrom = itemValues[fromSelect.value];
            const valTo = itemValues[toSelect.value];

            // Шанс = (Цена депа / Цена цели) * 100, максимум 95%
            let chance = Math.round((valFrom / valTo) * 100);
            if (chance > 95) chance = 95;
            if (chance < 5) chance = 5;

            chanceText.textContent = chance + '%';
            const deg = (chance / 100) * 360;
            wheel.style.background = `conic-gradient(#ff7b00 0deg ${deg}deg, #181824 ${deg}deg 360deg)`;
        }

        fromSelect.addEventListener('change', updateChance);
        toSelect.addEventListener('change', updateChance);
        updateChance();

        // Логика прокрутки апгрейдера
        let currentRotation = 0;
        upgradeBtn.addEventListener('click', () => {
            const valFrom = itemValues[fromSelect.value];
            const valTo = itemValues[toSelect.value];
            let chance = Math.round((valFrom / valTo) * 100);
            if (chance > 95) chance = 95;
            if (chance < 5) chance = 5;

            currentRotation += 720 + Math.floor(Math.random() * 360);
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            upgradeResult.textContent = currentLang === 'ru' ? "Крутим апгрейд..." : "Крутимо апгрейд...";
            upgradeBtn.disabled = true;

            setTimeout(() => {
                const roll = Math.floor(Math.random() * 100) + 1;
                if (roll <= chance) {
                    upgradeResult.style.color = '#34d399';
                    upgradeResult.textContent = currentLang === 'ru' ? 
                        `✅ УСПЕХ! Заапгрейдил до [${toSelect.value}]!` : 
                        `✅ УСПІХ! Заапгрейдив до [${toSelect.value}]!`;
                } else {
                    upgradeResult.style.color = '#f87171';
                    upgradeResult.textContent = currentLang === 'ru' ? 
                        `❌ ПРОЕБАЛ! Шмотка [${fromSelect.value}] сгорела.` : 
                        `❌ ПРОЇБАТИ! Шмотка [${fromSelect.value}] згоріла.`;
                }
                upgradeBtn.disabled = false;
            }, 1200);
        });
    </script>
</body>
</html>
