<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mivlir App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #111213;
            --surface: #18191b;
            --surface-2: #1f2023;
            --field: #0e0e10;
            --line: #2a2b2e;
            --text: #e6e6e6;
            --muted: #8b8d91;
            --soft: #e4e4e7;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        [hidden] { display: none !important; }

        html { background: var(--bg); }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Фон: падающий снег и редкие падающие звёзды */
        #sky {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(17, 18, 19, 0.92);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo-area { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

        .logo { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; color: #fff; }

        .world-time {
            font-size: 11px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        .balance {
            display: flex;
            align-items: center;
            gap: 5px;
            height: 32px;
            padding-left: 10px;
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .balance.bump { animation: bump 0.35s ease; }
        @keyframes bump { 40% { transform: scale(1.08); } }

        .balance .plus {
            width: 30px;
            height: 30px;
            border: none;
            border-left: 1px solid var(--line);
            background: transparent;
            color: #fff;
            font-size: 17px;
            line-height: 1;
            cursor: pointer;
            border-radius: 0 7px 7px 0;
        }
        .balance .plus:active { background: var(--soft); color: #111; }

        .coin { width: 14px; height: 14px; display: inline-block; vertical-align: -2px; }

        .lang-btn {
            background: var(--surface-2);
            border: 1px solid var(--line);
            color: #fff;
            height: 32px;
            padding: 0 11px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }
        .lang-btn:active { transform: scale(0.95); background: var(--soft); border-color: var(--soft); color: #111; }

        main {
            position: relative;
            z-index: 1;
            flex: 1;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .view { display: flex; flex-direction: column; gap: 16px; }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card h2 { font-size: 15px; font-weight: 600; }
        .card p { font-size: 12px; color: var(--muted); line-height: 1.4; }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .center { text-align: center; }

        /* ---------- Кнопки ---------- */
        .btn {
            width: 100%;
            background: var(--soft);
            color: #111;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, opacity 0.2s;
        }
        .btn:active { transform: scale(0.98); background: #c4c4c8; }
        .btn:disabled { opacity: 0.4; cursor: default; transform: none; }
        .btn.ghost { background: var(--surface-2); color: #fff; border: 1px solid var(--line); }
        .btn.ghost:active { background: #2a2b2f; }
        .btn.small { width: auto; padding: 8px 16px; font-size: 12px; border-radius: 10px; }

        .ghost-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface-2);
            border: 1px solid var(--line);
            color: #fff;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .ghost-btn:active { background: #2a2b2f; }
        .ghost-btn:disabled { opacity: 0.4; }

        /* ---------- Идея ---------- */
        textarea {
            width: 100%;
            height: 80px;
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px;
            color: #fff;
            font-size: 13px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus { border-color: var(--muted); }

        .status-toast { text-align: center; font-size: 12px; min-height: 16px; color: var(--muted); }
        .status-toast.ok  { color: #8fd3a8; }
        .status-toast.err { color: #e59a9a; }

        /* ---------- Редкости ---------- */
        .r-mil  { --rc: #4b69ff; --rg: rgba(75, 105, 255, 0.38); }
        .r-res  { --rc: #8847ff; --rg: rgba(136, 71, 255, 0.38); }
        .r-cla  { --rc: #d32ce6; --rg: rgba(211, 44, 230, 0.36); }
        .r-cov  { --rc: #eb4b4b; --rg: rgba(235, 75, 75, 0.38); }
        .r-gold { --rc: #e4ae39; --rg: rgba(228, 174, 57, 0.42); }

        /* ---------- Список кейсов ---------- */
        .cases-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

        .case-tile {
            background: none;
            border: none;
            color: inherit;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .case-art {
            background: linear-gradient(180deg, #36373c, #222327);
            border: 1px solid var(--line);
            border-radius: 12px;
            aspect-ratio: 1.25;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            transition: transform 0.15s, border-color 0.15s;
        }
        .case-art svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.5)); }
        .case-tile:active .case-art { transform: scale(0.97); border-color: var(--muted); }

        .case-name { font-size: 13px; font-weight: 600; padding-left: 2px; }
        .case-price { font-size: 12px; color: var(--muted); padding-left: 2px; font-variant-numeric: tabular-nums; }

        /* ---------- Предметы ---------- */
        .items-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

        .item { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

        .art {
            aspect-ratio: 1.45;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 7px 6px;
            background: linear-gradient(180deg, #36373c, #232428);
            border-radius: 8px 8px 4px 4px;
            border-bottom: 3px solid var(--rc);
            box-shadow: inset 0 -26px 24px -22px var(--rg);
            overflow: hidden;
        }
        .art svg, .art img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.55)); object-fit: contain; }

        .item .w { font-size: 10.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item .s { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .mini-sell {
            margin-top: 2px;
            background: var(--surface-2);
            border: 1px solid var(--line);
            color: #fff;
            border-radius: 6px;
            padding: 4px 0;
            font-size: 10.5px;
            font-weight: 600;
            cursor: pointer;
            font-variant-numeric: tabular-nums;
        }
        .mini-sell:active { background: var(--soft); color: #111; }

        /* ---------- Страница кейса ---------- */
        .topbar { display: flex; justify-content: space-between; align-items: center; }

        .stage {
            position: relative;
            min-height: 176px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .big-crate { width: min(250px, 72vw); }
        .big-crate svg { width: 100%; display: block; filter: drop-shadow(0 10px 10px rgba(0, 0, 0, 0.55)); }

        .roulette {
            display: none;
            position: relative;
            width: 100%;
            height: 136px;
            overflow: hidden;
            border-radius: 12px;
            background: var(--field);
            border: 1px solid var(--line);
        }
        .stage.spin .big-crate { display: none; }
        .stage.spin .roulette { display: block; }

        .roulette::before, .roulette::after {
            content: "";
            position: absolute;
            top: 0; bottom: 0;
            width: 38px;
            z-index: 3;
            pointer-events: none;
        }
        .roulette::before { left: 0;  background: linear-gradient(90deg, #0e0e10, rgba(14, 14, 16, 0)); }
        .roulette::after  { right: 0; background: linear-gradient(270deg, #0e0e10, rgba(14, 14, 16, 0)); }

        .marker {
            position: absolute;
            left: 50%;
            top: 0; bottom: 0;
            width: 2px;
            margin-left: -1px;
            background: #f0f0f2;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.55);
            z-index: 4;
        }
        .marker::before, .marker::after { content: ""; position: absolute; left: -6px; border: 6px solid transparent; }
        .marker::before { top: 0;    border-top-color: #f0f0f2;    border-bottom: 0; }
        .marker::after  { bottom: 0; border-bottom-color: #f0f0f2; border-top: 0; }

        .track { position: absolute; left: 0; top: 9px; display: flex; gap: 6px; will-change: transform; }

        .rcard {
            flex: 0 0 108px;
            height: 116px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 6px 5px;
            background: linear-gradient(180deg, #2c2d31, #1c1d20);
            border-radius: 8px;
            border-bottom: 3px solid var(--rc);
            box-shadow: inset 0 -26px 26px -22px var(--rg);
            overflow: hidden;
        }
        .rcard .art { width: 100%; flex: 1; min-height: 0; padding: 0; background: none; border: none; box-shadow: none; aspect-ratio: auto; }
        .rcard .w { font-size: 10px; font-weight: 600; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rcard .s { font-size: 9px; color: var(--muted); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rcard.win { box-shadow: inset 0 -26px 26px -18px var(--rg), 0 0 16px var(--rg); }

        .notice {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
            padding: 12px;
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 12px;
        }
        .notice b { font-size: 13px; letter-spacing: 0.02em; }

        .open-row { display: flex; gap: 8px; }

        .fast-btn {
            flex: 0 0 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-2);
            border: 1px solid var(--line);
            color: var(--muted);
            border-radius: 12px;
            cursor: pointer;
        }
        .fast-btn.on { background: var(--soft); color: #111; border-color: var(--soft); }
        .fast-btn:disabled { opacity: 0.4; }

        .odds { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
        .odds span { display: inline-flex; align-items: center; gap: 5px; }
        .odds i { width: 8px; height: 8px; border-radius: 2px; background: var(--rc); }

        /* ---------- Окно выигрыша ---------- */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.74);
        }

        .modal-card {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
            padding: 18px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-top: 3px solid var(--rc);
            border-radius: 16px;
            animation: rise 0.28s ease;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(0.97); } }

        .m-rarity { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--rc); }
        .m-art { width: 100%; }
        .m-art .art { aspect-ratio: 1.7; padding: 12px; border-radius: 10px 10px 4px 4px; }
        .m-w { font-size: 16px; font-weight: 700; }
        .m-s { font-size: 13px; color: var(--muted); margin-top: 2px; }
        .m-val { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .modal-actions { display: flex; gap: 8px; width: 100%; }
        .modal-actions .btn { flex: 1; }

        /* ---------- Время мира ---------- */
        .clocks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .clock {
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
        }
        .clock .city { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: #4a4b4f; }
        .dot.day { background: var(--soft); }
        .clock .time { margin-top: 4px; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
        .clock .sub { margin-top: 2px; font-size: 11px; color: var(--muted); }


        /* ---------- Вкладки ---------- */
        .tabs { display: flex; gap: 6px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
        .tabs button { flex: 1; padding: 9px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.15s; }
        .tabs button.on { background: var(--soft); color: #111; }

        /* ---------- Апгрейдер ---------- */
        .dial { position: relative; width: min(270px, 76vw); height: min(270px, 76vw); margin: 0 auto; --spin: 4200ms; }
        .dial > svg { width: 100%; height: 100%; display: block; }
        .pointer-wrapper { position: absolute; inset: 0; pointer-events: none; transition: transform var(--spin) cubic-bezier(0.12, 0.75, 0.15, 1); will-change: transform; }
        .pointer-wrapper svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.6)); }
        .dial.win { animation: pop 0.5s ease; }
        @keyframes pop { 50% { transform: scale(1.03); } }

        .up-sum { text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 16px; }
        .up-result { text-align: center; font-size: 13px; font-weight: 600; min-height: 18px; color: #c9c9cd; }
        .up-result.win { color: #8fd3a8; }
        .up-result.lose { color: #e59a9a; }

        .up-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .up-panel { background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 8px; min-height: 132px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
        .up-panel .ph { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 10.5px; line-height: 1.25; color: var(--muted); font-weight: 600; text-transform: uppercase; }
        .up-panel .ph button { flex: none; padding: 4px 8px; font-size: 10px; border-radius: 7px; }
        .up-stack { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .up-hint { margin: auto; text-align: center; font-size: 11px; color: var(--muted); padding: 6px; }
        .bal-chip { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 7px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }

        .bal-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--field); border: 1px solid var(--line); border-radius: 12px; }
        .bal-row .lbl { font-size: 10.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
        .bal-row input[type=range] { flex: 1; min-width: 0; accent-color: #e4e4e7; }
        .bal-row .val { min-width: 54px; text-align: right; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }

        .mults { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
        .mults button { padding: 10px 0; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; }
        .mults button:active { background: var(--soft); color: #111; }
        .mults button.on { background: var(--soft); color: #111; border-color: var(--soft); }
        .mults button:disabled { opacity: 0.4; }

        .up-go { letter-spacing: 0.18em; text-transform: uppercase; padding: 15px; font-size: 15px; font-weight: 800; }

        .filters { display: flex; gap: 6px; }
        .fld { flex: 1; min-width: 0; padding: 9px 10px; background: var(--field); border: 1px solid var(--line); border-radius: 10px; color: #fff; font-size: 12px; outline: none; }
        .fld:focus { border-color: var(--muted); }
        .sort-btn { flex: 0 0 38px; display: flex; align-items: center; justify-content: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; color: #fff; font-size: 14px; cursor: pointer; }

        .pick { cursor: pointer; position: relative; }
        .pick .art { transition: box-shadow 0.15s; }
        .pick.on .art { outline: 2px solid var(--soft); outline-offset: -2px; }
        .pick .pv { font-size: 10.5px; font-weight: 600; color: var(--soft); font-variant-numeric: tabular-nums; }
        .pick:active { opacity: 0.8; }
        .grid-scroll { max-height: 420px; overflow-y: auto; padding-right: 2px; }
        .empty-up { text-align: center; padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }

        @media (prefers-reduced-motion: reduce) { .dial.win { animation: none; } }

        @media (prefers-reduced-motion: reduce) {
            .balance.bump, .modal-card { animation: none; }
        }
    </style>
</head>
<body>
    <canvas id="sky"></canvas>

    <header>
        <div class="logo-area">
            <div class="logo">m1vlirapp</div>
            <div class="world-time" id="localTime">--:--:--</div>
        </div>
        <div class="header-right">
            <div class="balance" id="balance">
                <span id="balanceVal">0</span><span data-coin></span>
                <button class="plus" id="plusBtn" type="button" aria-label="+">+</button>
            </div>
            <button class="lang-btn" id="langToggleBtn" type="button">RU</button>
        </div>
    </header>

    <main>
        <nav class="tabs" id="tabs">
            <button type="button" data-tab="home" class="on" id="tabHome"></button>
            <button type="button" data-tab="up" id="tabUp"></button>
        </nav>

        <!-- ============ ГЛАВНАЯ ============ -->
        <section class="view" id="viewHome">
            <div class="card">
                <h2 id="casesTitle"></h2>
                <div class="cases-grid" id="casesGrid"></div>
                <p id="demoNote"></p>
            </div>

            <div class="card" id="invCard">
                <div class="row">
                    <h2 id="invTitle"></h2>
                    <button class="ghost-btn" id="sellAllBtn" type="button" hidden></button>
                </div>
                <div class="items-grid" id="invGrid"></div>
                <p id="invEmpty"></p>
            </div>

            <!-- Предложить идею -->
            <div class="card">
                <h2 id="cardTitle"></h2>
                <p id="cardDesc"></p>
                <textarea id="ideaInput"></textarea>
                <button class="btn" id="sendBtn" type="button"></button>
                <div class="status-toast" id="statusToast"></div>
            </div>

            <!-- Время мира -->
            <div class="card">
                <h2 id="clocksTitle"></h2>
                <div class="clocks" id="clocks"></div>
            </div>
        </section>

        <!-- ============ СТРАНИЦА КЕЙСА ============ -->
        <section class="view" id="viewCase" hidden>
            <div class="topbar">
                <button class="ghost-btn" id="backBtn" type="button"><span>←</span><span id="backTxt"></span></button>
                <button class="ghost-btn" id="soundBtn" type="button" aria-label="sound"></button>
            </div>

            <div class="card">
                <div class="stage" id="stage">
                    <div class="big-crate" id="bigCrate"></div>
                    <div class="roulette" id="roulette">
                        <div class="marker"></div>
                        <div class="track" id="track"></div>
                    </div>
                </div>
                <h2 class="center" id="caseName"></h2>

                <div class="notice" id="notice" hidden>
                    <b id="noticeTitle"></b>
                    <p id="noticeText"></p>
                    <button class="btn small" id="topUpBtn" type="button"></button>
                </div>

                <div class="open-row">
                    <button class="fast-btn" id="fastBtn" type="button" aria-label="fast"></button>
                    <button class="btn" id="openBtn" type="button"></button>
                </div>
                <div class="odds" id="odds"></div>
            </div>

            <div class="card">
                <h2 id="contentsTitle"></h2>
                <div class="items-grid" id="contentsGrid"></div>
            </div>
        </section>

    function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
    function lerpHex(a, b, t) {
        const x = hexRgb(a), y = hexRgb(b);
        return 'rgb(' + x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(',') + ')';
    }
    function mulberry(seed) {
        let a = seed >>> 0;
        return function () {
            a = (a + 0x6D2B79F5) >>> 0;
            let t = a;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }

    function skinPattern(it) {
        const acc = it.acc || '#ffffff';

                for (let k = -1; k < 10; k++) s += '<path d="M' + (k * 26) + ' 0h9l-26 90h-9z" fill="' + acc + '" fill-opacity=".85"/>';

            case 'camo':
                for (let k = 0; k < 11; k++) {
                    s += '<ellipse cx="' + (rnd() * 200).toFixed(1) + '" cy="' + (10 + rnd() * 60).toFixed(1) +
                         '" rx="' + (8 + rnd() * 14).toFixed(1) + '" ry="' + (5 + rnd() * 8).toFixed(1) +
                         '" fill="' + (k % 2 ? it.c2 : acc) + '" fill-opacity=".75"/>';
                }
                break;
            case 'dots':
                for (let y = 18, r = 0; y < 76; y += 11, r++) {
                    for (let x = 6 + (r % 2) * 6; x < 200; x += 12) s += '<circle cx="' + x + '" cy="' + y + '" r="2.4" fill="' + acc + '" fill-opacity=".8"/>';
                }
                break;
            case 'flames':
                for (let k = 0; k < 14; k++) {
                    const x = k * 15, h1 = (28 + rnd() * 26).toFixed(1), h2 = (22 + rnd() * 20).toFixed(1);
                    s += '<path d="M' + x + ' 80Q' + (x + 4) + ' ' + h1 + ' ' + (x + 8) + ' ' + h2 + 'Q' + (x + 12) + ' 46 ' + (x + 15) + ' 80z" fill="' + acc + '" fill-opacity=".85"/>';
                }

            case 'scales':
                for (let y = 14, r = 0; y < 84; y += 8, r++) {

    const ITEMS = RAW.map((x, i) => Object.assign({ id: i }, x));

    /* Бросок: сначала редкость по шансам, потом случайный предмет этой редкости */
    function pickItem(rand) {
        rand = rand || Math.random;
        let r = rand() * 100, acc = 0, tier = 'mil';
        for (let i = 0; i < RAR_DESC.length; i++) {
            const k = RAR_DESC[RAR_DESC.length - 1 - i];     // от частых к редким
            acc += RAR[k];
            if (r < acc) { tier = k; break; }
            tier = k;

        const pool = ITEMS.filter((it) => it.r === tier);
        return pool[Math.floor(rand() * pool.length)];

    /* ================= СОСТОЯНИЕ (баланс + инвентарь) ================= */

            if (typeof s.balance === 'number' && s.balance >= 0) state.balance = Math.floor(s.balance);
            if (Array.isArray(s.inv)) state.inv = s.inv.filter((x) => x && ITEMS[x.id]);
            state.sound = s.sound !== false;

    /* ---------- звук и вибрация ---------- */
    let actx = null;
    function clickSound() {
        if (!state.sound) return;
        try {
            actx = actx || new (window.AudioContext || window.webkitAudioContext)();
            const o = actx.createOscillator(), g = actx.createGain();
            o.type = 'square';
            o.frequency.value = 880;
            g.gain.setValueAtTime(0.03, actx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.04);
            o.connect(g); g.connect(actx.destination);
            o.start(); o.stop(actx.currentTime + 0.05);
        } catch (e) {}
    }

    /* ---------- рулетка как в CS2 ---------- */
    const CARD_W = 108, GAP = 6, STEP = CARD_W + GAP;
    const STRIP_N = 60, WIN_IDX = 48;
    const REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const SPIN_MS = REDUCE ? 700 : 6200;

    const stage = $('stage'), roulette = $('roulette'), track = $('track');

    function rcardHTML(it, win) {
        return '<div class="rcard r-' + it.r + (win ? ' win-target' : '') + '" data-id="' + it.id + '">' +
               artHTML(it) + '<div class="w">' + esc(it.w) + '</div><div class="s">' + esc(it.n) + '</div></div>';
    }

    function buildStrip(winner) {
        let html = '';
        for (let i = 0; i < STRIP_N; i++) {
            html += rcardHTML(i === WIN_IDX ? winner : pickItem(), i === WIN_IDX);
        }
        track.innerHTML = html;
    }

    function readX() {
        const m = getComputedStyle(track).transform;
        if (!m || m === 'none') return 0;
        const v = m.slice(m.indexOf('(') + 1, -1).split(',');
        return parseFloat(m.indexOf('matrix3d') === 0 ? v[12] : v[4]) || 0;
    }

    function tickLoop(center) {
        let last = -1, lastAt = 0;
        (function step(now) {
            if (!spinning) return;
            const idx = Math.floor((center - readX()) / STEP);
            if (idx !== last) {
                last = idx;
                clickSound();
                if (now - lastAt > 70) { haptic.select(); lastAt = now; }
            }
            requestAnimationFrame(step);
        })(0);
    }

    function lockControls(on) {
        spinning = on;
        renderCaseControls();
        $('backBtn').disabled = on;
    }

    function openCase() {
        if (spinning || state.balance < CASE.price) return;

        const win = pickItem();
        const uid = Date.now() + '-' + Math.floor(Math.random() * 1e6);
        state.balance -= CASE.price;
        state.inv.push({ uid: uid, id: win.id });      // предмет в инвентаре сразу — не потеряется
        save();
        renderBalance(true);
        haptic.impact('medium');
        try { if (actx && actx.state === 'suspended') actx.resume(); } catch (e) {}

        lockControls(true);

        if (state.fast) {
            showResult(win, uid);
            return;
        }

        buildStrip(win);
        stage.classList.add('spin');
        track.style.transition = 'none';
        track.style.transform = 'translateX(0px)';
        void track.offsetWidth;

        const center = roulette.clientWidth / 2;
        const jitter = (Math.random() * 2 - 1) * (CARD_W / 2 - 10);       // останавливается в любом месте карточки
        const targetCenter = WIN_IDX * STEP + CARD_W / 2 + jitter;
        const x = -(targetCenter - center);

        track.style.transition = 'transform ' + SPIN_MS + 'ms cubic-bezier(0.1, 0.65, 0.05, 1)';
        track.style.transform = 'translateX(' + x + 'px)';
        tickLoop(center);

        setTimeout(() => {
            const w = track.querySelector('.win-target');
            if (w) w.classList.add('win');
            haptic.impact('light');
            setTimeout(() => showResult(win, uid), 450);
        }, SPIN_MS + 150);
    }

    /* ================= ВРЕМЯ МИРА ================= */
    const CITIES = [
        { tz: ['Europe/Kyiv', 'Europe/Kiev'], ru: 'Киев',     ua: 'Київ',     en: 'Kyiv' },
        { tz: ['Europe/Moscow'],              ru: 'Москва',   ua: 'Москва',   en: 'Moscow' },
        { tz: ['Europe/London'],              ru: 'Лондон',   ua: 'Лондон',   en: 'London' },
        { tz: ['America/New_York'],           ru: 'Нью-Йорк', ua: 'Нью-Йорк', en: 'New York' },
        { tz: ['Asia/Dubai'],                 ru: 'Дубай',    ua: 'Дубай',    en: 'Dubai' },
        { tz: ['Asia/Tokyo'],                 ru: 'Токио',    ua: 'Токіо',    en: 'Tokyo' }
    ];

    function makeFmt(tzList) {
        // у старых WebView может не быть 'Europe/Kyiv' — пробуем запасное имя
        for (let i = 0; i < tzList.length; i++) {
            try {
                return new Intl.DateTimeFormat('en-GB', {
                    timeZone: tzList[i],
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', second: '2-digit',
                    hourCycle: 'h23'
                });
            } catch (e) {}
        }
        return null;
    }

    function parts(fmt, date) {
        const o = {};
        fmt.formatToParts(date).forEach((p) => { o[p.type] = p.value; });
        return o;
    }

    const dayNum = (o) => Date.UTC(+o.year, +o.month - 1, +o.day) / 86400000;

    const localFmt = makeFmt([undefined]);
    const clocksEl = $('clocks');
    const localTimeEl = $('localTime');
    const tiles = [];

    CITIES.forEach((c) => {
        const fmt = makeFmt(c.tz);
        if (!fmt) return;
        const el = document.createElement('div');
        el.className = 'clock';
        el.innerHTML = '<div class="city"><span class="dot"></span><span class="name"></span></div>' +
                       '<div class="time">--:--:--</div><div class="sub"></div>';
        clocksEl.appendChild(el);
        tiles.push({
            c, fmt,
            dot: el.querySelector('.dot'),
            name: el.querySelector('.name'),
            time: el.querySelector('.time'),
            sub: el.querySelector('.sub')
        });
    });

    function clockTick() {
        const now = new Date(), t = T[lang];
        let localDay = null;
        if (localFmt) {
            const lp = parts(localFmt, now);
            localDay = dayNum(lp);
            let date = '';
            try { date = now.toLocaleDateString(t.locale, { weekday: 'short', day: 'numeric', month: 'short' }); } catch (e) {}
            localTimeEl.textContent = lp.hour + ':' + lp.minute + ':' + lp.second + (date ? ' · ' + date : '');
        }
        tiles.forEach((x) => {
            const p = parts(x.fmt, now);
            x.time.textContent = p.hour + ':' + p.minute + ':' + p.second;
            const h = +p.hour;
            const isDay = h >= 7 && h < 21;
            x.dot.className = 'dot' + (isDay ? ' day' : '');
            let rel = '';
            if (localDay !== null) {
                const diff = dayNum(p) - localDay;
                rel = diff === 0 ? t.today : (diff > 0 ? t.tomorrow : t.yesterday);
            }
            x.sub.textContent = rel + (rel ? ' · ' : '') + (isDay ? t.day : t.night);
        });
    }

    function clockLoop() {
        try { clockTick(); } catch (e) {}
        setTimeout(clockLoop, 1000 - (Date.now() % 1000) + 5);
    }

    /* ================= ИДЕЯ ================= */
    const ideaInput = $('ideaInput');
    const sendBtn = $('sendBtn');
    const statusToast = $('statusToast');
    let toastState = null;

    function renderToast() {
        const t = T[lang];
        if (!toastState) { statusToast.textContent = ''; statusToast.className = 'status-toast'; return; }
        const k = toastState.kind;
        statusToast.className = 'status-toast ' + (k === 'ok' ? 'ok' : 'err');
        statusToast.textContent = k === 'ok'
            ? t.success + (toastState.test ? t.testSuffix : '')
            : (k === 'empty' ? t.empty : t.fail);
    }

    sendBtn.addEventListener('click', () => {
        const text = ideaInput.value.trim();
        if (!text) {
            toastState = { kind: 'empty' };
            haptic.notify('warning');
            renderToast();
            return;
        }
        const payload = JSON.stringify({ idea: text });

        if (tg && tg.initData) {
            try {
                tg.sendData(payload);
                ideaInput.value = '';
                toastState = { kind: 'ok' };
                haptic.notify('success');
            } catch (err) {
                toastState = { kind: 'fail' };
            }
        } else {
            ideaInput.value = '';
            toastState = { kind: 'ok', test: true };
        }
        renderToast();
    });


    /* ================= АПГРЕЙДЕР ================= */
    const up = { sel: new Set(), bal: 0, target: null, pending: null, last: null, mult: null, invDesc: true, catDesc: true, from: '', to: '', q: '' };
    const UP_MS = REDUCE ? 400 : 4200;
    $('dial').style.setProperty('--spin', UP_MS + 'ms');
    let upSpin = false, upRot = 0;

    const r2 = (n) => Math.round(n * 100) / 100;
    const upBet = () => {
        let s = up.bal;
        state.inv.forEach((x) => { if (up.sel.has(x.uid)) s += ITEMS[x.id].v; });
        return s;
    };
    const upChance = () => {
        const b = upBet();
        if (!b || up.target === null) return 0;
        return r2(Math.min(95, Math.max(0.01, b / ITEMS[up.target].v * 100)));
    };

    /* Шкала как на референсе: 0% внизу, 50% слева/справа, 100% вверху (угол от верха по часовой) */
    const DC = 130, f2 = (n) => n.toFixed(2);
    function dpt(r, th) { const a = th * Math.PI / 180; return [DC + r * Math.sin(a), DC - r * Math.cos(a)]; }
    function sector(rO, rI, a1, a2) {
        const p1 = dpt(rO, a1), p2 = dpt(rO, a2), p3 = dpt(rI, a2), p4 = dpt(rI, a1);
        const large = (a2 - a1) > 180 ? 1 : 0;
        return 'M' + f2(p1[0]) + ' ' + f2(p1[1]) + 'A' + rO + ' ' + rO + ' 0 ' + large + ' 1 ' + f2(p2[0]) + ' ' + f2(p2[1]) +
               'L' + f2(p3[0]) + ' ' + f2(p3[1]) + 'A' + rI + ' ' + rI + ' 0 ' + large + ' 0 ' + f2(p4[0]) + ' ' + f2(p4[1]) + 'Z';
    }
    (function buildTicks() {
        let sd = '', ld = '';
        for (let p = 0; p <= 100; p += 2) {
            const long = p % 10 === 0, r1 = long ? 109 : 114;
            ((p === 0 || p === 100) ? [1] : [-1, 1]).forEach((s) => {
                const a = dpt(r1, 180 + s * p * 1.8), b = dpt(119, 180 + s * p * 1.8);
                const seg = 'M' + f2(a[0]) + ' ' + f2(a[1]) + 'L' + f2(b[0]) + ' ' + f2(b[1]);
                if (long) ld += seg; else sd += seg;
            });
        }
        $('ticksShort').setAttribute('d', sd);
        $('ticksLong').setAttribute('d', ld);
    })();

    /* Бросок и угол приземления считаются вместе — стрелка всегда останавливается там, где выпал результат */
    function planSpin(ch, prev) {
        const half = ch * 1.8, isWin = Math.random() * 100 < ch;
        let th;
        if (isWin) { const m = Math.min(3, half * 0.2); th = 180 - half + m + Math.random() * (2 * half - 2 * m); }
        else { const span = 360 - 2 * half, m = Math.min(3, span * 0.2); th = 180 + half + m + Math.random() * (span - 2 * m); }
        th = ((th % 360) + 360) % 360;
        const want = (((th - 180) % 360) + 360) % 360;
        return { isWin: isWin, total: prev - (((prev % 360) + 360) % 360) + 360 * 5 + want };
    }

    function resetPointer() {
        const w = $('pointerWrapper');
        w.style.transition = 'none';
        w.style.transform = 'rotate(0deg)';
        upRot = 0;
        void w.offsetWidth;
        w.style.transition = '';
        $('dial').classList.remove('win');
    }

    function upSync() {
        if (up.bal > state.balance) up.bal = state.balance;
        if (!$('viewUp').hidden && !upSpin) renderUp();
    }

    function upMini(it, attrs, on) {
        return '<div class="item pick r-' + it.r + (on ? ' on' : '') + '" ' + attrs + '>' + artHTML(it) +
               '<div class="w">' + esc(it.w) + '</div><div class="s">' + esc(it.n) + '</div>' +
               '<div class="pv">' + it.v + ' ' + COIN + '</div></div>';
    }

    let upMsg = { k: 'init' };
    function renderUpMsg() {
        const t = T[lang], el = $('upResult');
        let s = t.upInit, c = '';
        if (upMsg.k === 'spin') s = t.upSpin;
        else if (upMsg.k === 'win') { s = t.upWin.replace('{n}', upMsg.n); c = ' win'; }
        else if (upMsg.k === 'lose') { s = t.upLose; c = ' lose'; }
        el.textContent = s;
        el.className = 'up-result' + c;
    }

    function renderUpTop() {
        const t = T[lang], bet = upBet();
        let ch = upChance(), shBet = bet;
        if (bet <= 0 && up.last && up.target === up.last.tid) { ch = up.last.ch; shBet = up.last.bet; }
        else if (up.last) { up.last = null; if (!upSpin) { resetPointer(); upMsg = { k: 'init' }; } }
        up.sel.forEach((u) => { if (!state.inv.some((x) => x.uid === u)) up.sel.delete(u); });

        const zone = $('zone');
        zone.setAttribute('d', ch > 0 ? sector(90, 60, 180 - ch * 1.8, 180 + ch * 1.8) : '');
        $('chanceText').textContent = ch.toFixed(2) + '%';
        $('chanceLabel').textContent = (ch === 0 ? '' : (ch < 33 ? t.chLow : (ch < 66 ? t.chMid : t.chHigh))).toUpperCase();

        const tg2 = up.target === null ? null : ITEMS[up.target];
        $('upSum').innerHTML = shBet || tg2 ?
            t.bet + ' ' + shBet + ' ' + COIN + (tg2 ? '  →  ' + t.target + ' ' + tg2.v + ' ' + COIN : '') : '';

        let left = state.inv.filter((x) => up.sel.has(x.uid)).map((x) => upMini(ITEMS[x.id], 'data-uid="' + esc(x.uid) + '"', true)).join('');
        if (up.bal > 0) left = '<div class="bal-chip">' + t.balLbl + ': ' + up.bal + ' ' + COIN + '</div>' + left;
        $('upLeft').innerHTML = left || '<div class="up-hint" style="grid-column:1/-1">' + t.upHintL + '</div>';
        $('upRight').innerHTML = tg2 ? upMini(tg2, 'data-clear="1"', true).replace('class="item pick', 'style="grid-column:1/-1" class="item pick') :
            '<div class="up-hint" style="grid-column:1/-1">' + t.upHintR + '</div>';

        const rg = $('balRange');
        rg.max = state.balance;
        rg.value = up.bal;
        rg.disabled = upSpin || state.balance <= 0;
        $('balVal').innerHTML = up.bal + ' ' + COIN;

        document.querySelectorAll('#mults button').forEach((b) => {
            b.disabled = upSpin || bet <= 0;
            b.classList.toggle('on', up.mult === b.getAttribute('data-m'));
        });
        $('upBtn').disabled = upSpin || bet <= 0 || up.target === null;
        $('upClearL').disabled = upSpin; $('upClearR').disabled = upSpin;
        renderUpMsg();
    }

    function renderUpLists() {
        const t = T[lang];
        let inv = state.inv.filter((x) => x.uid !== up.pending).map((x) => ({ x: x, it: ITEMS[x.id] }));
        inv.sort((a, b) => up.invDesc ? b.it.v - a.it.v : a.it.v - b.it.v);
        $('upInv').innerHTML = inv.length ? inv.map((o) => upMini(o.it, 'data-uid="' + esc(o.x.uid) + '"', up.sel.has(o.x.uid))).join('') : '';
        if (!inv.length) {
            $('upInv').innerHTML = '<div class="empty-up" style="grid-column:1/-1">' + t.upEmptyInv +
                '<button class="btn small" type="button" data-go="home">' + t.goCases + '</button></div>';
        }
        const lo = up.from === '' ? 0 : +up.from, hi = up.to === '' ? Infinity : +up.to, q = up.q.trim().toLowerCase();
        let cat = ITEMS.filter((it) => it.v >= lo && it.v <= hi && (it.w + ' ' + it.n).toLowerCase().indexOf(q) >= 0);
        cat.sort((a, b) => up.catDesc ? b.v - a.v : a.v - b.v);
        $('upCat').innerHTML = cat.map((it) => upMini(it, 'data-tid="' + it.id + '"', up.target === it.id)).join('');
        $('invSort').textContent = up.invDesc ? '↓' : '↑';
        $('catSort').textContent = up.catDesc ? '↓' : '↑';
    }

    function renderUp() { renderUpTop(); renderUpLists(); }

    function applyUp() {
        const t = T[lang];
        $('tabHome').textContent = t.tabHome; $('tabUp').textContent = t.tabUp;
        $('upTitle').textContent = t.upTitle;
        $('upLeftT').textContent = t.upLeftT; $('upRightT').textContent = t.upRightT;
        $('upClearL').textContent = t.clear; $('upClearR').textContent = t.clear;
        $('balLbl').textContent = t.balLbl;
        $('upBtn').textContent = t.upgrade;
        $('myItemsT').textContent = t.myItems; $('selItemT').textContent = t.selItem;
        $('fFrom').placeholder = t.from; $('fTo').placeholder = t.to; $('fQ').placeholder = t.search;
        if (!$('viewUp').hidden) renderUp();
    }

    function pickTarget(want) {
        const bet = upBet();
        if (bet <= 0) return;
        let best = null, d = Infinity, max = ITEMS[0];
        ITEMS.forEach((it) => {
            if (it.v > max.v) max = it;
            if (it.v <= bet) return;
            const dd = Math.abs(it.v - want);
            if (dd < d) { d = dd; best = it; }
        });
        up.target = (best || max).id;
    }

    /* --- события --- */
    document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => {
        if (spinning || upSpin) return;
        haptic.select();
        const v = b.getAttribute('data-tab');
        showView(v);
        if (v === 'up') renderUp();
    }));

    $('upInv').addEventListener('click', (e) => {
        if (upSpin) return;
        const go = e.target.closest('[data-go]');
        if (go) { showView('home'); return; }
        const el = e.target.closest('[data-uid]');
        if (!el) return;
        const u = el.getAttribute('data-uid');
        if (up.sel.has(u)) up.sel.delete(u); else up.sel.add(u);
        up.mult = null;
        haptic.select();
        renderUp();
    });
    $('upLeft').addEventListener('click', (e) => {
        if (upSpin) return;
        const el = e.target.closest('[data-uid]');
        if (!el) return;
        up.sel.delete(el.getAttribute('data-uid'));
        up.mult = null;
        renderUp();
    });
    $('upCat').addEventListener('click', (e) => {
        if (upSpin) return;
        const el = e.target.closest('[data-tid]');
        if (!el) return;
        up.target = +el.getAttribute('data-tid');
        up.mult = null;
        haptic.select();
        renderUp();
    });
    $('upRight').addEventListener('click', (e) => {
        if (!upSpin && e.target.closest('[data-clear]')) { up.target = null; up.mult = null; renderUp(); }
    });
    $('upClearL').addEventListener('click', () => { up.sel.clear(); up.bal = 0; up.mult = null; upMsg = { k: 'init' }; renderUp(); });
    $('upClearR').addEventListener('click', () => { up.target = null; up.mult = null; upMsg = { k: 'init' }; renderUp(); });

    $('balRange').addEventListener('input', (e) => {
        up.bal = Math.min(state.balance, +e.target.value || 0);
        up.mult = null;
        renderUpTop();
    });

    $('mults').addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b || upSpin) return;
        const m = b.getAttribute('data-m'), bet = upBet();
        if (bet <= 0) return;
        if (m[0] === 'x') pickTarget(bet * +m.slice(1));
        else pickTarget(bet / (+m.slice(1) / 100));
        up.mult = m;
        haptic.select();
        renderUp();
    });

    $('invSort').addEventListener('click', () => { up.invDesc = !up.invDesc; renderUpLists(); });
    $('catSort').addEventListener('click', () => { up.catDesc = !up.catDesc; renderUpLists(); });
    [['fFrom', 'from'], ['fTo', 'to'], ['fQ', 'q']].forEach((p) => $(p[0]).addEventListener('input', (e) => { up[p[1]] = e.target.value; renderUpLists(); }));

    $('upBtn').addEventListener('click', () => {
        const ch = upChance();
        if (upSpin || ch <= 0 || up.target === null || upBet() <= 0) return;
        const tgt = ITEMS[up.target];
        const plan = planSpin(ch, upRot);
        upRot = plan.total;
        up.last = { ch: ch, bet: upBet(), tid: up.target };

        /* ставка списывается, результат применяется сразу — перезагрузкой страницы не обойти */
        state.inv = state.inv.filter((x) => !up.sel.has(x.uid));
        state.balance -= up.bal;
        let uid = null;
        if (plan.isWin) {
            uid = Date.now() + '-' + Math.floor(Math.random() * 1e6);
            state.inv.push({ uid: uid, id: tgt.id });
        }
        save();
        up.sel.clear(); up.bal = 0; up.mult = null; up.pending = uid;
        upSpin = true;
        upMsg = { k: 'spin' };
        renderBalance(true);
        renderUp();
        haptic.impact('medium');
        try { if (actx && actx.state === 'suspended') actx.resume(); } catch (e) {}

        $('pointerWrapper').style.transform = 'rotate(' + upRot + 'deg)';

        setTimeout(() => {
            upSpin = false;
            up.pending = null;
            const d = $('dial');
            d.classList.remove('win');
            if (plan.isWin) { void d.offsetWidth; d.classList.add('win'); }
            upMsg = plan.isWin ? { k: 'win', n: tgt.w + ' | ' + tgt.n } : { k: 'lose' };
            haptic.notify(plan.isWin ? 'success' : 'error');
            renderUp();
            renderInventory();
            if (plan.isWin) setTimeout(() => showResult(tgt, uid), 350);
        }, UP_MS + 150);
    });

    /* ================= ПРИМЕНИТЬ ЯЗЫК ================= */
    const langBtn = $('langToggleBtn');

    function applyLang() {
        const t = T[lang];
        document.documentElement.lang = lang === 'ua' ? 'uk' : lang;
        langBtn.textContent = t.btn;
        $('cardTitle').textContent = t.title;
        $('cardDesc').textContent = t.desc;
        ideaInput.placeholder = t.placeholder;
        sendBtn.textContent = t.send;
        $('casesTitle').textContent = t.casesTitle;
        $('demoNote').textContent = t.demoNote;
        $('invTitle').textContent = t.inventory;
        $('invEmpty').textContent = t.invEmpty;
        applyUp();
        $('clocksTitle').textContent = t.clocks;
        tiles.forEach((x) => { x.name.textContent = x.c[lang]; });
        renderCases();
        renderInventory();
        $('backTxt').textContent = t.back;
        $('contentsTitle').textContent = t.contents;
        renderCaseControls();
        renderToast();
        try { clockTick(); } catch (e) {}
    }

    langBtn.addEventListener('click', () => {
        lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length];
        try { localStorage.setItem('mv_lang', lang); } catch (e) {}
        haptic.select();
        applyLang();
        if (!$('modal').hidden) {
            const w = state.inv.find((x) => x.uid === modalUid);
            if (w) showResult(ITEMS[w.id], modalUid);
        }
    });

    document.querySelectorAll('[data-coin]').forEach((e) => { e.innerHTML = COIN; });
    renderBalance(false);
    renderCaseStatic();
    applyLang();
    clockLoop();

    /* ================= ФОН: СНЕГ + ПАДАЮЩИЕ ЗВЁЗДЫ ================= */
    try {
        const cv = $('sky');
        const ctx = cv.getContext('2d');
        const DPR = Math.min(window.devicePixelRatio || 1, 2);
        let W = 0, H = 0, flakes = [], shoots = [], nextShoot = 2500, last = 0;

        const rnd = (a, b) => a + Math.random() * (b - a);

        const makeFlake = (atTop) => ({
            x: rnd(0, W), y: atTop ? -5 : rnd(0, H),
            r: rnd(0.7, 2.2), v: rnd(18, 55),
            sw: rnd(8, 26), ph: rnd(0, 6.28), a: rnd(0.25, 0.7)
        });

        const draw = (ts, dt) => {
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = '#fff';
            for (let i = 0; i < flakes.length; i++) {
                let fl = flakes[i];
                fl.y += fl.v * dt;
                fl.x += Math.sin(ts / 1000 * 0.6 + fl.ph) * fl.sw * dt;
                if (fl.y > H + 5) { fl = flakes[i] = makeFlake(true); }
                ctx.globalAlpha = fl.a;
                ctx.beginPath();
                ctx.arc(fl.x, fl.y, fl.r, 0, 6.2832);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            if (MODE !== 'snow' && !REDUCE) {
                nextShoot -= dt * 1000;
                if (nextShoot <= 0) {
                    const a = rnd(0.55, 0.85), sp = rnd(520, 820);
                    shoots.push({ x: rnd(0.3, 1) * W, y: rnd(0, 0.35) * H, vx: -Math.cos(a) * sp, vy: Math.sin(a) * sp });
                    nextShoot = rnd(3500, 8000);
                }
                for (let j = shoots.length - 1; j >= 0; j--) {
                    const s = shoots[j];
                    s.x += s.vx * dt; s.y += s.vy * dt;
                    if (s.y > H + 40 || s.x < -40) { shoots.splice(j, 1); continue; }
                    const tx = s.x - s.vx * 0.13, ty = s.y - s.vy * 0.13;
                    const g = ctx.createLinearGradient(s.x, s.y, tx, ty);
                    g.addColorStop(0, 'rgba(255,255,255,0.85)');
                    g.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.strokeStyle = g;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(s.x, s.y);
                    ctx.lineTo(tx, ty);
                    ctx.stroke();
                }
            }
        };

        const resize = () => {
            W = window.innerWidth; H = window.innerHeight;
            cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            flakes = [];
            if (MODE !== 'stars') {
                const n = Math.max(30, Math.min(Math.round(W * H / 9000), 110));
                for (let i = 0; i < n; i++) flakes.push(makeFlake(false));
            }
            if (REDUCE) draw(0, 0);
        };

        const frame = (ts) => {
            const dt = Math.min((ts - last) / 1000, 0.05);
            last = ts;
            draw(ts, dt);
            requestAnimationFrame(frame);
        };

        window.addEventListener('resize', resize);
        resize();
        if (!REDUCE) requestAnimationFrame((ts) => { last = ts; frame(ts); });
    } catch (e) { /* фон не критичен — приложение работает и без него */ }
})();
</script>
</body>
</html>
