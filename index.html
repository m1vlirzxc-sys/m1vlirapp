<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mivlir</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0d0d0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }
        .lang-switcher {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #1a1a1e;
            border: 1px solid #2d2d38;
            border-radius: 8px;
            padding: 6px 12px;
            color: #a855f7;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }
        .container {
            width: 100%;
            max-width: 360px;
        }
        h1 {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 0 0 10px 0;
            color: #a855f7;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }
        p {
            font-size: 15px;
            color: #a1a1aa;
            margin: 0 0 20px 0;
        }
        .input-box {
            width: 100%;
            padding: 14px 16px;
            background-color: #1a1a1e;
            border: 2px solid #2d2d38;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .input-box:focus {
            border-color: #a855f7;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #9333ea, #a855f7);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
            margin-bottom: 12px;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .tg-link {
            display: inline-block;
            padding: 10px 20px;
            background: #1a1a1e;
            border: 1px solid #2d2d38;
            border-radius: 10px;
            color: #a1a1aa;
            font-size: 14px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <select id="langSelect" class="lang-switcher" onchange="changeLanguage()">
        <option value="ru" selected>RU</option>
        <option value="ua">UA</option>
    </select>

    <div class="container">
        <h1>mivlir</h1>
        <p id="desc">Пишите идеи для бота в комменты или отправляйте прямо здесь:</p>
        
        <input type="text" id="ideaInput" class="input-box" placeholder="Например: добавить мини-игру...">
        <button id="sendBtn" class="btn" onclick="sendIdea()">Отправить идею</button>
        
        <a href="https://t.me/m1vlirka" class="tg-link" onclick="openTg(event)">Канал: @m1vlirka</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        const GROUP_ID = "-5424216533"; 
        const BOT_TOKEN = "9167237060:AAFX3SseqTEci8c2xneXnjtdXx6AJ_-AeBY";

        const translations = {
            ru: {
                desc: "Пишите идеи для бота в комменты или отправляйте прямо здесь:",
                placeholder: "Например: добавить мини-игру...",
                btn: "Отправить идею",
                sending: "Отправка...",
                sent: "✅ Идея отправлена в группу!",
                empty: "Введите текст идеи!"
            },
            ua: {
                desc: "Пишіть ідеї для бота в коментарі або надсилайте прямо тут:",
                placeholder: "Наприклад: додати міні-гру...",
                btn: "Надіслати ідею",
                sending: "Відправка...",
                sent: "✅ Ідею відправлено в групу!",
                empty: "Введіть текст ідеї!"
            }
        };

        function changeLanguage() {
            let lang = document.getElementById("langSelect").value;
            document.getElementById("desc").innerText = translations[lang].desc;
            document.getElementById("ideaInput").placeholder = translations[lang].placeholder;
            document.getElementById("sendBtn").innerText = translations[lang].btn;
        }

        async function sendIdea() {
            let lang = document.getElementById("langSelect").value;
            let input = document.getElementById('ideaInput');
            let btn = document.getElementById('sendBtn');
            let text = input.value.trim();

            if (!text) {
                alert(translations[lang].empty);
                return;
            }

            btn.disabled = true;
            btn.innerText = translations[lang].sending;

            let user = tg.initDataUnsafe?.user;
            let sender = user 
                ? (user.username ? `@${user.username}` : `${user.first_name} (ID: ${user.id})`)
                : "Аноним (открыто вне ТГ)";

            let messageText = `💡 <b>Новая идея из App!</b>\n\n👤 <b>От:</b> ${sender}\n💬 <b>Идея:</b> ${text}`;

            try {
                let response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: GROUP_ID,
                        text: messageText,
                        parse_mode: 'HTML'
                    })
                });

                if (response.ok) {
                    alert(translations[lang].sent);
                    input.value = "";
                    tg.close();
                } else {
                    alert("Ошибка отправки. Убедись, что бот добавлен в группу `mmmlll`!");
                }
            } catch (e) {
                alert("Ошибка сети!");
            } finally {
                btn.disabled = false;
                btn.innerText = translations[lang].btn;
            }
        }

        function openTg(e) {
            e.preventDefault();
            tg.openTelegramLink("https://t.me/m1vlirka");
        }
    </script>
</body>
</html>
