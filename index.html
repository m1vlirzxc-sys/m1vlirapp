<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mivlir</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0d0d0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 0 0 12px 0;
            color: #a855f7;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }
        p {
            font-size: 16px;
            color: #a1a1aa;
            margin: 0 0 28px 0;
        }
        .tg-link {
            display: inline-block;
            padding: 14px 32px;
            background: #1a1a1e;
            border: 1px solid #a855f7;
            border-radius: 12px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
            transition: transform 0.15s, background 0.2s;
        }
        .tg-link:active {
            transform: scale(0.96);
            background: #a855f7;
        }
    </style>
</head>
<body>

    <h1>mivlir</h1>
    <p>Пишите идеи для бота в комменты или сюда:</p>
    <a href="https://t.me/mivlir" class="tg-link" onclick="openTg(event)">@mivlir</a>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function openTg(e) {
            e.preventDefault();
            tg.openTelegramLink("https://t.me/mivlir");
        }
    </script>
</body>
</html>
