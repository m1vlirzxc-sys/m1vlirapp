<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mivlir App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0b0e;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(11, 11, 14, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1a1a24;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ff7b00;
        }

        .lang-btn {
            background: #161622;
            border: 1px solid #2a2a3c;
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }

        .lang-btn:active {
            transform: scale(0.95);
            background: #ff7b00;
            border-color: #ff7b00;
        }

        main {
            flex: 1;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background: #13131c;
            border: 1px solid #202030;
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .card h2 {
            font-size: 16px;
            font-weight: 600;
        }

        .card p {
            font-size: 13px;
            color: #9ca3af;
            line-height: 1.4;
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #08080c;
            border: 1px solid #222233;
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #ff7b00;
        }

        .submit-btn {
            background: #ff7b00;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .submit-btn:active {
            transform: scale(0.98);
            background: #e06d00;
        }

        .status-toast {
            text-align: center;
            font-size: 13px;
            color: #34d399;
            min-height: 16px;
        }

        /* РЕЖИМ РОФЛ АПГРЕЙДЕРА (КОЛЕСО / ШАНС) */
        .upgrade-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 10px 0;
        }

        .wheel-container {
            position: relative;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: conic-gradient(#ff7b00 0deg 110deg, #181824 110deg 360deg);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 15px rgba(255, 123, 0, 0.2);
            border: 2px solid #2a2a3c;
            transition: transform 1s cubic-bezier(0.15, 0.85, 0.35, 1);
        }

        .wheel-center {
            width: 96px;
            height: 96px;
            background: #0d0d12;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #2a2a3c;
            text-align: center;
        }

        .wheel-chance {
            font-size: 16px;
            font-weight: 700;
            color: #ff7b00;
        }

        .wheel-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
        }

        .pointer {
            position: absolute;
            top: -6px;
            width: 0; 
            height: 0; 
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 12px solid #ff7b00;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
        }

        .upgrade-result {
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            min-height: 20px;
            color: #d1d5db;
        }

        .upgrade-btn {
            background: #1b1b28;
            border: 1px solid #ff7b00;
            color: #ff7b00;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.15s;
        }

        .upgrade-btn:active {
            transform: scale(0.97);
            background: #ff7b00;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">m1vlirapp</div>
        <button class="lang-btn" id="langToggleBtn">UA / РУС</button>
    </header>

    <main>
        <!-- Карточка отправки идеи -->
        <div class="card">
            <h2 id="cardTitle">Предложить идею</h2>
            <p id="cardDesc">Напиши свою мысль или предложение — оно улетит прямо в группу.</p>
            <textarea id="ideaInput" placeholder="Текст идеи..."></textarea>
            <button class="submit-btn" id="sendBtn">Отправить</button>
            <div class="status-toast" id="statusToast"></div>
        </div>

        <!-- Рофл апгрейдер (Колесо шанса) -->
        <div class="card">
            <h2 id="upTitle">🎰 Рофл Апгрейдер</h2>
            <div class="upgrade-section">
                <div class="wheel-container" id="wheel">
                    <div class="pointer"></div>
                    <div class="wheel-center">
                        <div class="wheel-chance" id="chanceText">31%</div>
                        <div class="wheel-label">Шанс</div>
                    </div>
                </div>
                <div class="upgrade-result" id="upgradeResult">Крути апгрейд на шмотку!</div>
                <button class="upgrade-btn" id="upgradeBtn">Крутить апгрейд</button>
            </div>
        </div>
    </main>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Переключение языка
        let currentLang = 'ru';
        const langToggleBtn = document.getElementById('langToggleBtn');
        const cardTitle = document.getElementById('cardTitle');
        const cardDesc = document.getElementById('cardDesc');
        const ideaInput = document.getElementById('ideaInput');
        const sendBtn = document.getElementById('sendBtn');
        const upTitle = document.getElementById('upTitle');
        const upgradeBtn = document.getElementById('upgradeBtn');
        const upgradeResult = document.getElementById('upgradeResult');

        const texts = {
            ru: {
                title: "Предложить идею",
                desc: "Напиши свою мысль или предложение — оно улетит прямо в группу.",
                placeholder: "Текст идеи...",
                send: "Отправить",
                upTitle: "🎰 Рофл Апгрейдер",
                upBtn: "Крутить апгрейд",
                upInit: "Крути апгрейд на шмотку!",
                success: "Отправлено в группу!"
            },
            ua: {
                title: "Запропонувати ідею",
                desc: "Напиши свою думку чи пропозицію — вона полетить прямо в групу.",
                placeholder: "Текст ідеї...",
                send: "Надіслати",
                upTitle: "🎰 Рофл Апгрейдер",
                upBtn: "Крутити апгрейд",
                upInit: "Крути апгрейд на шмотку!",
                success: "Надіслано в групу!"
            }
        };

        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'ru' ? 'ua' : 'ru';
            cardTitle.textContent = texts[currentLang].title;
            cardDesc.textContent = texts[currentLang].desc;
            ideaInput.placeholder = texts[currentLang].placeholder;
            sendBtn.textContent = texts[currentLang].send;
            upTitle.textContent = texts[currentLang].upTitle;
            upgradeBtn.textContent = texts[currentLang].upBtn;
            upgradeResult.textContent = texts[currentLang].upInit;
        });

        // Логика отправки идеи
        const statusToast = document.getElementById('statusToast');
        sendBtn.addEventListener('click', () => {
            const text = ideaInput.value.trim();
            if (!text) {
                statusToast.style.color = '#f87171';
                statusToast.textContent = currentLang === 'ru' ? 'Напиши текст идеи!' : 'Напиши текст ідеї!';
                return;
            }

            const payload = JSON.stringify({ idea: text });

            if (tg && tg.initData) {
                try {
                    tg.sendData(payload);
                    ideaInput.value = '';
                    statusToast.style.color = '#34d399';
                    statusToast.textContent = texts[currentLang].success;
                } catch (err) {
                    statusToast.style.color = '#f87171';
                    statusToast.textContent = 'Ошибка отправки';
                }
            } else {
                ideaInput.value = '';
                statusToast.style.color = '#34d399';
                statusToast.textContent = texts[currentLang].success + ' (тест)';
            }
        });

        // Логика рофл апгрейдера
        const wheel = document.getElementById('wheel');
        const chanceText = document.getElementById('chanceText');
        const roflItems = [
            "❌ СКАМ: Ты проебал пиксели",
            "✅ Выбил: Катана из картона (StatTrak)",
            "✅ Выбил: Деревянный нож | Заноза",
            "❌ СКАМ: Тебя кинул админ",
            "✅ Выбил: Шаурма с кошатиной (Factory New)",
            "❌ СКАМ: Ошибка 1000-7",
            "✅ Выбил: Припять 2006 (Сувенирный)"
        ];

        let currentRotation = 0;
        upgradeBtn.addEventListener('click', () => {
            const chance = Math.floor(Math.random() * 85) + 5; // Случайный шанс от 5% до 90%
            chanceText.textContent = chance + '%';
            
            // Настройка градиента колеса под шанс
            const deg = (chance / 100) * 360;
            wheel.style.background = `conic-gradient(#ff7b00 0deg ${deg}deg, #181824 ${deg}deg 360deg)`;

            // Вращение колеса
            currentRotation += 720 + Math.floor(Math.random() * 360);
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            upgradeResult.textContent = "Крутим...";
            upgradeBtn.disabled = true;

            setTimeout(() => {
                const win = Math.random() * 100 <= chance;
                if (win) {
                    const item = roflItems.filter(i => i.startsWith("✅"))[Math.floor(Math.random() * 3)];
                    upgradeResult.style.color = '#34d399';
                    upgradeResult.textContent = item;
                } else {
                    const item = roflItems.filter(i => i.startsWith("❌"))[Math.floor(Math.random() * 4)];
                    upgradeResult.style.color = '#f87171';
                    upgradeResult.textContent = item;
                }
                upgradeBtn.disabled = false;
            }, 1000);
        });
    </script>
</body>
</html>
