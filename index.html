<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mivlir App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0b0e;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(11, 11, 14, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #1f1f2e;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #a78bfa;
        }

        .burger-btn {
            background: #16161f;
            border: 1px solid #272738;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: 0.15s ease;
        }

        .burger-btn:active {
            transform: scale(0.92);
        }

        .burger-btn span {
            display: block;
            width: 18px;
            height: 2px;
            background-color: #fff;
            border-radius: 2px;
        }

        .dropdown-menu {
            position: fixed;
            top: 68px;
            right: 16px;
            background: #14141c;
            border: 1px solid #272738;
            border-radius: 16px;
            padding: 8px;
            width: 180px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            display: none;
            flex-direction: column;
            gap: 4px;
            z-index: 20;
        }

        .dropdown-menu.active {
            display: flex;
        }

        .menu-item {
            background: transparent;
            border: none;
            color: #f3f4f6;
            padding: 12px 14px;
            border-radius: 10px;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }

        .menu-item:hover, .menu-item:active {
            background: rgba(167, 139, 250, 0.15);
        }

        main {
            flex: 1;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background: #13131a;
            border: 1px solid #212130;
            border-radius: 20px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .card p {
            font-size: 13px;
            color: #9ca3af;
            line-height: 1.4;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #09090c;
            border: 1px solid #222233;
            border-radius: 14px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #8b5cf6;
        }

        .submit-btn {
            background: #7c3aed;
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .submit-btn:active {
            transform: scale(0.98);
            background: #6d28d9;
        }

        .status-toast {
            text-align: center;
            font-size: 13px;
            color: #34d399;
            min-height: 18px;
        }

        /* Фонарик (вспышка) */
        .flashlight-overlay {
            position: fixed;
            inset: 0;
            background-color: #ffffff;
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            transition: background-color 0.15s ease;
        }

        .flashlight-overlay.active {
            display: flex;
        }

        .flash-controls {
            background: rgba(15, 15, 20, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 20px;
            width: 85%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            color: #fff;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        }

        .flash-title {
            font-size: 16px;
            font-weight: 600;
            text-align: center;
        }

        .slider-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-box label {
            font-size: 12px;
            color: #d1d5db;
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #fff;
            cursor: pointer;
        }

        .flash-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .flash-btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s;
        }

        .flash-btn:active {
            transform: scale(0.97);
        }

        .flash-btn.exit {
            background: #dc2626;
            border-color: #dc2626;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">m1vlirapp</div>
        <button class="burger-btn" id="burgerBtn">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <div class="dropdown-menu" id="dropdownMenu">
        <button class="menu-item" id="openFlashlightBtn">🔦 Фонарик</button>
    </div>

    <main>
        <div class="card">
            <h2>Предложить идею</h2>
            <p>Напиши свою мысль или предложение — оно сразу отправится в бот.</p>
            <textarea id="ideaInput" placeholder="Текст идеи..."></textarea>
            <button class="submit-btn" id="sendBtn">Отправить</button>
            <div class="status-toast" id="statusToast"></div>
        </div>
    </main>

    <div class="flashlight-overlay" id="flashlightOverlay">
        <div class="flash-controls">
            <div class="flash-title">Режим вспышки</div>
            <div class="slider-box">
                <label>
                    <span>Яркость</span>
                    <span id="brightnessVal">100%</span>
                </label>
                <input type="range" id="brightnessSlider" min="20" max="100" value="100">
            </div>
            <div class="flash-buttons">
                <button class="flash-btn" id="togglePowerBtn">Выключить свет</button>
                <button class="flash-btn" id="fullscreenBtn">На весь экран</button>
                <button class="flash-btn exit" id="exitFlashBtn">Выйти</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const burgerBtn = document.getElementById('burgerBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const openFlashlightBtn = document.getElementById('openFlashlightBtn');
        const ideaInput = document.getElementById('ideaInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusToast = document.getElementById('statusToast');

        const flashlightOverlay = document.getElementById('flashlightOverlay');
        const brightnessSlider = document.getElementById('brightnessSlider');
        const brightnessVal = document.getElementById('brightnessVal');
        const togglePowerBtn = document.getElementById('togglePowerBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const exitFlashBtn = document.getElementById('exitFlashBtn');

        let isLightOn = true;

        burgerBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('active');
        });

        document.addEventListener('click', () => {
            dropdownMenu.classList.remove('active');
        });

        sendBtn.addEventListener('click', () => {
            const text = ideaInput.value.trim();
            if (!text) {
                statusToast.style.color = '#f87171';
                statusToast.textContent = 'Напиши текст идеи!';
                return;
            }

            const payload = JSON.stringify({ idea: text });

            if (tg && tg.initData) {
                try {
                    tg.sendData(payload);
                    ideaInput.value = '';
                    statusToast.style.color = '#34d399';
                    statusToast.textContent = 'Отправлено!';
                } catch (err) {
                    statusToast.style.color = '#f87171';
                    statusToast.textContent = 'Ошибка отправки';
                }
            } else {
                ideaInput.value = '';
                statusToast.style.color = '#34d399';
                statusToast.textContent = 'Отправлено (тестовый режим)';
            }
        });

        openFlashlightBtn.addEventListener('click', () => {
            dropdownMenu.classList.remove('active');
            flashlightOverlay.classList.add('active');
            isLightOn = true;
            updateLight();
            if (tg) tg.expand();
        });

        function updateLight() {
            if (!isLightOn) {
                flashlightOverlay.style.backgroundColor = '#0a0a0f';
                togglePowerBtn.textContent = 'Включить свет';
                return;
            }
            const val = brightnessSlider.value;
            brightnessVal.textContent = val + '%';
            const c = Math.round((val / 100) * 255);
            flashlightOverlay.style.backgroundColor = `rgb(${c}, ${c}, ${c})`;
            togglePowerBtn.textContent = 'Выключить свет';
        }

        brightnessSlider.addEventListener('input', updateLight);

        togglePowerBtn.addEventListener('click', () => {
            isLightOn = !isLightOn;
            updateLight();
        });

        fullscreenBtn.addEventListener('click', () => {
            if (tg) {
                tg.expand();
                if (tg.requestFullscreen) tg.requestFullscreen();
            }
            if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            }
        });

        exitFlashBtn.addEventListener('click', () => {
            flashlightOverlay.classList.remove('active');
            if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            }
            if (tg && tg.exitFullscreen) tg.exitFullscreen();
        });
    </script>
</body>
</html>
